<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beauty Salon - Customer Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <!-- Шапка -->
    <header class="site-header">
        <div class="header-logo">
            <img src="/BeautySalonAPI/img/Beauty.svg" alt="Logo">
        </div>
        <div class="header-contact">
            <p>+7 (123) 456-78-90</p>
        </div>
    </header>

    <!-- Основной контейнер -->
    <div class="split-container">
        <!-- Левая часть - форма -->
        <div class="form-section">
            <div class="login-container">
                <h2>Customer Login</h2>

                <div class="input-wrapper">
                    <input type="text" class="input-field" id="username" placeholder="Login">
                </div>

                <div class="input-wrapper">
                    <input type="password" class="input-field" id="password" placeholder="Password">
                </div>

                <button class="enter-button" onclick="login()">Enter</button>
                <button class="registration-button" onclick="goToRegistration()">Register</button>
            </div>
        </div>

        <!-- Правая часть - изображение -->
        <div class="image-section"></div>
    </div>

    <!-- Подвал -->
    <footer class="site-footer">
        <p>&copy; 2025 Beauty Salon. All rights reserved.</p>
    </footer>

    <!-- JS скрипты -->
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                let response = await fetch(`/api/customer/fio/${username}`);
                if (response.ok) {
                    const customerData = await response.json();
                    if (customerData.password === password) {
                        alert(`Customer login successful: ${username}`);
                        window.location.href = 'customer-home.html';
                        return;
                    }
                }

                alert('Invalid username or password');
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function goToRegistration() {
            window.location.href = '/BeautySalonAPI/html/registration.html';
        }
    </script>
</body>
</html>
