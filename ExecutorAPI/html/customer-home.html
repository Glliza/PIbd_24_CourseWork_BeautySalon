<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer Profile</title>
    <link rel="stylesheet" href="styles.css"> <!-- Подключаем общий CSS -->
</head>
<body class="login-page">
    <header class="site-header">
        <div class="header-logo">
            <img src="/BeautySalonAPI/img/Beauty.svg" alt="Logo">
        </div>
        <div class="header-contact">
            <p>+7 (123) 456-78-90</p>
        </div>
    </header>

    <main class="profile-main">
        <h2 style="text-align: center; margin-top: 80px;">Customer Profile</h2>

        <div class="profile-info">
            <div class="info-column">
                <p><strong>FIO:</strong> [Customer Full Name]</p>
                <p><strong>Birth Date:</strong> [Date]</p>
                <p><strong>Email:</strong> [Email]</p>
            </div>
            <div class="button-column">
                <button class="report-button" onclick="generateVisitReport()">Generate Visit Report</button>
                <button class="report-button" onclick="generateRequestReport()">Generate Request Report</button>
            </div>
        </div>

        <div class="scrollable-section">
            <div class="request-list">
                <h3>Requests</h3>
                <ul>
                    <li>Request 1: Haircut</li>
                    <li>Request 2: Facial</li>
                </ul>
            </div>
            <div class="card-container">
                <div class="request-card">
                    <div class="card-header">Create Request</div>
                    <div class="card-actions">
                        <button>Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Beauty Salon. All rights reserved.</p>
    </footer>

    <!-- JS скрипты -->
    <script>
        async function generateVisitReport() {
            try {
                const response = await fetch('/api/report/generate-visit-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([])
                });

                if (!response.ok) throw new Error('Failed to generate report');
                const result = await response.json();
                alert(`Visit Report Generated: ${result.filePath}`);
            } catch (error) {
                console.error('Error generating visit report:', error);
                alert('Failed to generate visit report');
            }
        }

        async function generateRequestReport() {
            try {
                const response = await fetch('/api/report/generate-request-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([])
                });

                if (!response.ok) throw new Error('Failed to generate report');
                const result = await response.json();
                alert(`Request Report Generated: ${result.filePath}`);
            } catch (error) {
                console.error('Error generating request report:', error);
                alert('Failed to generate request report');
            }
        }
    </script>
</body>
</html>
