<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Beauty Salon - Worker Login</title>
</head>

<body>
    <div class="login-container">
        <h2>Worker Login</h2>
        <input type="text" class="input-field" id="username" placeholder="Login">
        <input type="password" class="input-field" id="password" placeholder="Password">

        <div class="dropdown-container">
            <select id="cashbox-select">
                <option value="">Select CashBox</option>
                <!-- Options will be populated dynamically -->
            </select>
            <button class="delete-button" onclick="deleteCashBox()">X</button>
        </div>

        <div class="action-buttons">
            <button class="create-button" onclick="createCashBox()">Create</button>
            <button class="enter-button" onclick="login()">Enter</button>
        </div>

        <button class="registration-button" onclick="goToRegistration()">Register</button>
    </div>

    <script>
        async function createCashBox() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            alert(`Creating cashbox for user: ${username}`);
            // Add API call to create cashbox
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const selectedCashBox = document.getElementById('cashbox-select').value;

            try {
                // Check if user is a worker or customer
                let response = await fetch(`/api/staff/fio/${username}`);
                if (response.ok) {
                    const staffData = await response.json();
                    if (staffData.password === password) {
                        alert(`Worker login successful: ${username}`);
                        window.location.href = 'worker-home.html';
                        return;
                    }
                }

                // If not a worker, check as customer
                response = await fetch(`/api/customer/fio/${username}`);
                if (response.ok) {
                    const customerData = await response.json();
                    if (customerData.password === password) {
                        alert(`Customer login successful: ${username}`);
                        window.location.href = 'customer-home.html';
                        return;
                    }
                }

                // If neither, show error
                alert('Invalid username or password');
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function deleteCashBox() {
            const selectedCashBox = document.getElementById('cashbox-select').value;
            if (selectedCashBox) {
                if (confirm(`Are you sure you want to delete cashbox: ${selectedCashBox}?`)) {
                    alert(`Deleting cashbox: ${selectedCashBox}`);
                    // Add API call to delete cashbox
                }
            } else {
                alert('Please select a cashbox to delete');
            }
        }

        function goToRegistration() {
            window.location.href = 'registration.html';
        }

        // Populate cashboxes dynamically (this would be done via an API call in a real application)
        document.addEventListener('DOMContentLoaded', () => {
            const cashboxSelect = document.getElementById('cashbox-select');
            // Example cashboxes
            const cashboxes = ['CashBox 1', 'CashBox 2', 'CashBox 3'];
            cashboxes.forEach(cb => {
                const option = document.createElement('option');
                option.value = cb;
                option.textContent = cb;
                cashboxSelect.appendChild(option);
            });
        });
    </script>
</body>

</html>
