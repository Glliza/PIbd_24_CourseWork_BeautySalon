<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Staff Profile</title>
    <link rel="stylesheet" href="styles.css"> <!-- Подключаем общий CSS -->
</head>
<body class="login-page">
    <header class="site-header">
        <div class="header-logo">
            <img src="/BeautySalonAPI/img/Beauty.svg" alt="Logo">
        </div>
        <div class="header-contact">
            <p>+7 (123) 456-78-90</p>
        </div>
    </header>
    <main class="profile-main">
        <h2 style="text-align: center; margin-top: 80px;">Staff Profile</h2>

        <div class="profile-info">
            <div class="info-column">
                <p><strong>FIO:</strong> [Staff Full Name]</p>
                <p><strong>Birth Date:</strong> [Date]</p>
                <p><strong>Post Type:</strong> [Type]</p>
            </div>
            <div class="button-column">
                <button class="store-button">Store</button>
                <button class="report-button" onclick="generateProductReport()">Generate Product Report</button>
                <button class="report-button" onclick="generateServiceReport()">Generate Service Report</button>
                <button class="report-button" onclick="generateVisitReport()">Generate Visit Report</button>
            </div>
        </div>

        <div class="scrollable-section">
            <div class="shift-list">
                <h3>Shifts</h3>
                <!-- Shifts will be listed here -->
                <ul>
                    <li>Shift 1: 09:00 - 18:00</li>
                    <li>Shift 2: 10:00 - 19:00</li>
                </ul>
            </div>
            <div class="card-container">
                <div class="receipt-card">
                    <div class="card-header">Receipt</div>
                    <div class="card-actions">
                        <button>Create</button>
                        <button>Delete</button>
                    </div>
                </div>
                <div class="visit-card">
                    <div class="card-header">Visits</div>
                    <div class="card-actions">
                        <button>Update</button>
                        <button>Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="site-footer">
        <p>&copy; 2025 Beauty Salon. All rights reserved.</p>
    </footer>

    <!-- JS скрипты -->
    <script>
        async function generateProductReport() {
            try {
                const response = await fetch('/api/report/generate-product-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([])
                });

                if (!response.ok) throw new Error('Failed to generate report');
                const result = await response.json();
                alert(`Product Report Generated: ${result.filePath}`);
            } catch (error) {
                console.error('Error generating product report:', error);
                alert('Failed to generate product report');
            }
        }

        async function generateServiceReport() {
            try {
                const response = await fetch('/api/report/generate-service-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([])
                });

                if (!response.ok) throw new Error('Failed to generate report');
                const result = await response.json();
                alert(`Service Report Generated: ${result.filePath}`);
            } catch (error) {
                console.error('Error generating service report:', error);
                alert('Failed to generate service report');
            }
        }

        async function generateVisitReport() {
            try {
                const response = await fetch('/api/report/generate-visit-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([])
                });

                if (!response.ok) throw new Error('Failed to generate report');
                const result = await response.json();
                alert(`Visit Report Generated: ${result.filePath}`);
            } catch (error) {
                console.error('Error generating visit report:', error);
                alert('Failed to generate visit report');
            }
        }
    </script>
</body>
</html>
