<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Staff Profile - Вы ужасны</title>
</head>
<body>

    <div class="header">
        <h1>Staff Profile</h1>
    </div>

    <div class="container staff-container">
        <div class="profile-info">
            <div class="info-column">
                <p><strong>FIO:</strong> [Staff Full Name]</p>
                <p><strong>Birth Date:</strong> [Date]</p>
                <p><strong>Post Type:</strong> [Type]</p>
            </div>
            <div class="button-column">
                <button class="btn-primary">Store</button>
            </div>
        </div>

        <div class="shift-section">
            <h2>Shifts</h2>
            <ul class="shift-list">
                <li>April 5, 2025 – Morning shift</li>
                <li>April 5, 2025 – Evening shift</li>
                <li>April 6, 2025 – Morning shift</li>
            </ul>
        </div>

        <div class="cards-section">
            <div class="card receipt-card">
                <div class="card-header">Receipt</div>
                <p>This card represents a receipt.</p>
                <div class="card-actions">
                    <button class="btn-primary">Create</button>
                    <button class="btn-secondary">Delete</button>
                </div>
            </div>

            <div class="card visit-card">
                <div class="card-header">Visits</div>
                <p>This card displays visits history.</p>
                <div class="card-actions">
                    <button class="btn-primary">Update</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
