<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Staff Profile</title>
    
</head>

<body>

    <div class="header">
        <h1>Staff Profile</h1>
    </div>

    <div class="profile-info">
        <div class="info-column">
            <p><strong>FIO:</strong> [Staff Full Name]</p>
            <p><strong>Birth Date:</strong> [Date]</p>
            <p><strong>Post Type:</strong> [Type]</p>
        </div>
        <div class="button-column">
            <button class="store-button">Store</button>
        </div>
    </div>

    <div class="scrollable-section">
        <div class="shift-list">
            <h2>Shifts</h2>
            <!-- Shifts will be listed here -->
        </div>
        <div class="card-container">
            <div class="receipt-card">
                <div class="card-header">Receipt</div>
                <!-- Receipt content goes here -->
                <div class="card-actions">
                    <button>Create</button>
                    <button>Delete</button>
                </div>
            </div>
            <div class="visit-card">
                <div class="card-header">Visits</div>
                <!-- Visit content goes here -->
                <div class="card-actions">
                    <button>Update</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
