<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Beauty Salon - Stock</title>
</head>

<body>
    <h1>Product Stock</h1>
    <div class="gallery-container">
        <!-- Product cards will be dynamically generated here -->
        <div class="product-card">
            <img src="path/to/product1.jpg" alt="Product 1">
            <div class="product-name">Product 1</div>
            <div class="product-info">Description of product 1</div>
        </div>
        <div class="product-card">
            <img src="path/to/product2.jpg" alt="Product 2">
            <div class="product-name">Product 2</div>
            <div class="product-info">Description of product 2</div>
        </div>
        <!-- Add more products as needed -->
    </div>

    <script>
        // This script would dynamically generate product cards based on API data
        document.addEventListener('DOMContentLoaded', () => {
            const galleryContainer = document.querySelector('.gallery-container');

            // Example products (in a real application, this would be fetched from an API)
            const products = [
                { name: 'Product 1', description: 'Description of product 1', image: 'path/to/product1.jpg' },
                { name: 'Product 2', description: 'Description of product 2', image: 'path/to/product2.jpg' }
                // Add more products as needed
            ];

            products.forEach(product => {
                const card = document.createElement('div');
                card.classList.add('product-card');

                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.name;

                const name = document.createElement('div');
                name.classList.add('product-name');
                name.textContent = product.name;

                const info = document.createElement('div');
                info.classList.add('product-info');
                info.textContent = product.description;

                card.appendChild(img);
                card.appendChild(name);
                card.appendChild(info);

                galleryContainer.appendChild(card);
            });
        });
    </script>
</body>

</html>
