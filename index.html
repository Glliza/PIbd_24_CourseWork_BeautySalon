<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 1rem;
        }

        .input-field {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .dropdown-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .dropdown-container select {
            width: calc(100% - 32px);
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .delete-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ff6347;
            color: white;
            border: none;
            padding: 0.2rem 0.5rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
        }

        .action-buttons button {
            width: 48%;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .create-button {
            background-color: #28a745;
            color: white;
        }

        .enter-button {
            background-color: #007bff;
            color: white;
        }

        .registration-button {
            margin-top: 1rem;
            background-color: #ffc107;
            color: white;
            border: none;
            padding: 0.7rem;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Worker Login</h2>
        <input type="text" class="input-field" id="username" placeholder="Login">
        <input type="password" class="input-field" id="password" placeholder="Password">

        <div class="dropdown-container">
            <select id="cashbox-select">
                <option value="">Select CashBox</option>
                <!-- Options will be populated dynamically -->
            </select>
            <button class="delete-button" onclick="deleteCashBox()">X</button>
        </div>

        <div class="action-buttons">
            <button class="create-button" onclick="createCashBox()">Create</button>
            <button class="enter-button" onclick="login()">Enter</button>
        </div>

        <button class="registration-button" onclick="goToRegistration()">Register</button>
    </div>

    <script>
        async function createCashBox() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            alert(`Creating cashbox for user: ${username}`);
            // Add API call to create cashbox
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const selectedCashBox = document.getElementById('cashbox-select').value;

            try {
                // Check if user is a worker or customer
                let response = await fetch(`/api/staff/fio/${username}`);
                if (response.ok) {
                    const staffData = await response.json();
                    if (staffData.password === password) {
                        alert(`Worker login successful: ${username}`);
                        window.location.href = 'home.html';
                        return;
                    }
                }

                // If not a worker, check as customer
                response = await fetch(`/api/customer/fio/${username}`);
                if (response.ok) {
                    const customerData = await response.json();
                    if (customerData.password === password) {
                        alert(`Customer login successful: ${username}`);
                        window.location.href = 'home.html';
                        return;
                    }
                }

                // If neither, show error
                alert('Invalid username or password');
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function deleteCashBox() {
            const selectedCashBox = document.getElementById('cashbox-select').value;
            if (selectedCashBox) {
                if (confirm(`Are you sure you want to delete cashbox: ${selectedCashBox}?`)) {
                    alert(`Deleting cashbox: ${selectedCashBox}`);
                    // Add API call to delete cashbox
                }
            } else {
                alert('Please select a cashbox to delete');
            }
        }

        function goToRegistration() {
            window.location.href = 'reg.html';
        }

        // Populate cashboxes dynamically (this would be done via an API call in a real application)
        document.addEventListener('DOMContentLoaded', () => {
            const cashboxSelect = document.getElementById('cashbox-select');
            // Example cashboxes
            const cashboxes = ['CashBox 1', 'CashBox 2', 'CashBox 3'];
            cashboxes.forEach(cb => {
                const option = document.createElement('option');
                option.value = cb;
                option.textContent = cb;
                cashboxSelect.appendChild(option);
            });
        });
    </script>
</body>

</html>
