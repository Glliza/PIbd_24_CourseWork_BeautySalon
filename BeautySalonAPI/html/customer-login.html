<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - Customer Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 1rem;
        }

        .input-field {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
        }

        .action-buttons button {
            width: 48%;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .enter-button {
            background-color: #007bff;
            color: white;
        }

        .registration-button {
            margin-top: 1rem;
            background-color: #ffc107;
            color: white;
            border: none;
            padding: 0.7rem;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Customer Login</h2>
        <input type="text" class="input-field" id="username" placeholder="Login">
        <input type="password" class="input-field" id="password" placeholder="Password">

        <div class="action-buttons">
            <button class="enter-button" onclick="login()">Enter</button>
        </div>

        <button class="registration-button" onclick="goToRegistration()">Register</button>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Check if user is a customer
                let response = await fetch(`/api/customer/fio/${username}`);
                if (response.ok) {
                    const customerData = await response.json();
                    if (customerData.password === password) {
                        alert(`Customer login successful: ${username}`);
                        window.location.href = 'customer-home.html';
                        return;
                    }
                }

                // If not a customer, show error
                alert('Invalid username or password');
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function goToRegistration() {
            window.location.href = 'registration.html';
        }
    </script>
</body>

</html>
