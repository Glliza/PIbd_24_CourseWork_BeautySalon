<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .registration-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .registration-container h2 {
            margin-bottom: 1rem;
        }

        .input-field {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
        }

        .action-buttons button {
            width: 48%;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .register-button {
            background-color: #28a745;
            color: white;
        }

        .back-button {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>

<body>
    <div class="registration-container">
        <h2>Register</h2>
        <input type="text" class="input-field" id="name" placeholder="Name">
        <input type="email" class="input-field" id="email" placeholder="Email">
        <input type="password" class="input-field" id="password" placeholder="Password">

        <div>
            <label>
                <input type="radio" name="user-type" value="worker" onclick="showWorkerFields()">
                Worker (Guarantor)
            </label>
        </div>
        <div>
            <label>
                <input type="radio" name="user-type" value="customer" onclick="showCustomerFields()">
                Customer (Executor)
            </label>
        </div>

        <input type="date" class="input-field" id="birthdate" placeholder="Birth Date" style="display:none;">
        <input type="number" class="input-field" id="number" placeholder="Number" style="display:none;">

        <div class="action-buttons">
            <button class="register-button" onclick="register()">Register</button>
            <button class="back-button" onclick="goBack()">Back</button>
        </div>
    </div>

    <script>
        function showWorkerFields() {
            document.getElementById('birthdate').style.display = 'block';
            document.getElementById('number').style.display = 'none';
        }

        function showCustomerFields() {
            document.getElementById('birthdate').style.display = 'none';
            document.getElementById('number').style.display = 'block';
        }

        async function register() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userType = document.querySelector('input[name="user-type"]:checked').value;

            let additionalField = '';
            if (userType === 'worker') {
                additionalField = document.getElementById('birthdate').value;
            } else {
                additionalField = document.getElementById('number').value;
            }

            try {
                const response = await fetch(`/api/${userType}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fio: name,
                        email: email,
                        password: password,
                        additionalField: additionalField
                    })
                });

                if (!response.ok) {
                    throw new Error(`Failed to register ${userType}`);
                }

                alert('Registration successful!');
                window.location.href = `${userType}-home.html`;
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
