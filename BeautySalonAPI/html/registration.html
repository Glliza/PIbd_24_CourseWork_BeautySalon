<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - Registration</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body class="registration-page">

    <!-- Шапка -->
    <header class="site-header">
        <div class="header-logo">
            <img src="/BeautySalonAPI/img/Beauty.svg" alt="Logo">
        </div>
        <div class="header-contact">
            <p>+7 (123) 456-78-90</p>
        </div>
    </header>

    <div class="split-container">
        <div class="form-section">
            <div class="registration-container">
    <h2>Register</h2>

    <div class="input-wrapper">
        <input type="text" class="input-field" id="name" placeholder="Name">
    </div>

    <div class="input-wrapper">
        <input type="email" class="input-field" id="email" placeholder="Email">
    </div>

    <div class="input-wrapper">
        <input type="password" class="input-field" id="password" placeholder="Password">
    </div>

    <div class="radio-group">
        <label>
            <input type="radio" name="user-type" value="worker" onclick="showWorkerFields()">
            Worker (Guarantor)
        </label>
    </div>
    <div class="radio-group">
        <label>
            <input type="radio" name="user-type" value="customer" onclick="showCustomerFields()">
            Customer (Executor)
        </label>
    </div>

    <div class="input-wrapper">
        <input type="date" class="input-field" id="birthdate" placeholder="Birth Date" style="display:none;">
    </div>

    <div class="input-wrapper">
        <input type="number" class="input-field" id="number" placeholder="Number" style="display:none;">
    </div>

    <div class="action-buttons">
        <button class="register-button" onclick="register()">Register</button>
        <button class="back-button" onclick="goBack()">Back</button>
    </div>
</div>
        </div>

        <div class="image-section"></div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 Beauty Salon. All rights reserved.</p>
    </footer>

    <!-- JS скрипты остаются без изменений -->
    <script>
        function showWorkerFields() {
            document.getElementById('birthdate').style.display = 'block';
            document.getElementById('number').style.display = 'none';
        }

        function showCustomerFields() {
            document.getElementById('birthdate').style.display = 'none';
            document.getElementById('number').style.display = 'block';
        }

        async function register() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userType = document.querySelector('input[name="user-type"]:checked').value;

            let additionalField = '';
            if (userType === 'worker') {
                additionalField = document.getElementById('birthdate').value;
            } else {
                additionalField = document.getElementById('number').value;
            }

            try {
                const response = await fetch(`/api/${userType}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fio: name,
                        email: email,
                        password: password,
                        additionalField: additionalField
                    })
                });

                if (!response.ok) {
                    throw new Error(`Failed to register ${userType}`);
                }

                alert('Registration successful!');
                window.location.href = `${userType}-home.html`;
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
